<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>回転音10案 — テトクラ</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #edf3f4;
        background: #10191c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1080px;
        margin: auto;
        padding: 32px 24px 64px;
      }
      nav {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      a {
        color: #a6dccd;
        text-underline-offset: 4px;
      }
      .eyebrow {
        color: #b2d6ca;
        letter-spacing: 0.15em;
        margin: 36px 0 12px;
        font-size: 12px;
      }
      h1 {
        font-size: clamp(28px, 5vw, 44px);
        margin: 0 0 16px;
      }
      p {
        color: #bfcdd0;
        line-height: 1.8;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin: 24px 0 12px;
      }
      button {
        font: inherit;
        color: #edf3f4;
        background: #263a40;
        border: 1px solid #658589;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:hover {
        background: #35525a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .primary {
        color: #102723;
        background: #b3e2cd;
        border-color: #b3e2cd;
      }
      .primary:hover {
        background: #d1f2e3;
      }
      :focus-visible {
        outline: 3px solid #f1d69d;
        outline-offset: 4px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input {
        width: 110px;
        accent-color: #b3e2cd;
      }
      output {
        min-width: 3em;
      }
      #status {
        min-height: 1.8em;
        color: #f1d69d;
      }
      #cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 24px;
      }
      article {
        border: 1px solid #476068;
        border-radius: 14px;
        background: #18272c;
        padding: 22px;
      }
      article[data-playing='true'] {
        border-color: #f1d69d;
        box-shadow: inset 0 0 0 1px #f1d69d;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #a8cbc4;
        font-size: 12px;
      }
      .number {
        color: #f1d69d;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      h2 {
        margin: 10px 0 0;
        font-size: 21px;
      }
      .feel {
        color: #d1ece2;
        font-size: 22px;
        margin: 10px 0;
      }
      article p {
        margin: 10px 0 18px;
        font-size: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .download {
        font-size: 12px;
        display: inline-block;
        margin-top: 16px;
      }
      footer {
        margin-top: 30px;
        border-top: 1px solid #476068;
        padding-top: 10px;
      }
      @media (max-width: 680px) {
        main {
          padding: 24px 16px 40px;
        }
        #cards {
          grid-template-columns: 1fr;
        }
        article {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="../">← テトクラへ</a><a href="../se-preview/">これまでのSE試聴室</a></nav>
      <div class="eyebrow">TETCLA / ROTATION SOUND STUDIES 02</div>
      <h1>コロコロ、ポロン、プルン。</h1>
      <p>
        回転音を、10の違う方向から。木・水・泡・弦・シンセまで、手触りから作り直しました。<br />気になる音は「連続回転」で、何度も鳴ったときの心地よさも比べてください。
      </p>
      <div class="toolbar">
        <label for="volume"
          >試聴音量 <input id="volume" type="range" min="0" max="100" value="70" /><output
            id="volume-value"
            >70%</output
          ></label
        >
        <button type="button" id="stop">停止</button>
        <button type="button" id="reference">現在のAを聴く</button>
      </div>
      <div class="toolbar">
        <button type="button" id="compare" class="primary" disabled>10種類を単発で比較</button>
        <button type="button" id="compare-repeat" disabled>10種類を連続回転で比較</button>
      </div>
      <p>連続回転は、ゆっくり4回 → 速く6回。同じ音量・同じリズムで比較します。</p>
      <p id="status" role="status" aria-live="polite">音源一覧を読み込んでいます…</p>
      <div id="cards"></div>
      <noscript><p>試聴ボタンにはJavaScriptが必要です。</p></noscript>
      <footer>
        <p>
          新しい10案は選定用です。採用する番号が決まったらゲームに反映します。<br />各MP3は同じフォルダーから保存できます。試聴音量はこのページだけに適用されます。
        </p>
      </footer>
    </main>
    <script type="module">
      const player = new Audio();
      player.preload = 'none';
      player.volume = 0.7;
      const status = document.querySelector('#status');
      let generation = 0;
      let timer;
      let queue = [];
      const resetCards = () => {
        for (const card of document.querySelectorAll('article')) card.dataset.playing = 'false';
      };
      function stop() {
        generation++;
        clearTimeout(timer);
        queue = [];
        player.pause();
        resetCards();
      }
      async function play(item) {
        const token = ++generation;
        resetCards();
        if (item.id) document.getElementById(item.id).dataset.playing = 'true';
        player.src = item.file;
        status.textContent = `再生中：${item.title}`;
        try {
          await player.play();
        } catch (error) {
          if (token !== generation || error.name === 'AbortError') return;
          stop();
          status.textContent = '音源を再生できませんでした。再生ボタンからもう一度お試しください。';
        }
      }
      player.addEventListener('ended', () => {
        resetCards();
        const next = queue.shift();
        if (next) timer = setTimeout(() => void play(next), 450);
        else status.textContent = '試聴が終わりました。';
      });
      function start(items) {
        stop();
        queue = [...items];
        void play(queue.shift());
      }
      document.querySelector('#stop').addEventListener('click', () => {
        stop();
        status.textContent = '停止しました。';
      });
      document
        .querySelector('#reference')
        .addEventListener('click', () =>
          start([{ file: '../se-preview/rotate_a.mp3', title: '現在のA（比較用）' }]),
        );
      document.querySelector('#volume').addEventListener('input', (event) => {
        player.volume = Number(event.target.value) / 100;
        document.querySelector('#volume-value').textContent = `${event.target.value}%`;
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stop();
          status.textContent = '停止しました。';
        }
      });
      try {
        const response = await fetch('./manifest.json');
        if (!response.ok) throw new Error('manifest');
        const samples = await response.json();
        const item = (sample, repeat) => ({
          id: sample.id,
          file: `./${repeat ? sample.repeatFile : sample.file}`,
          title: `${sample.id.slice(0, 2)} ${sample.title} / ${repeat ? '連続回転' : '単発'}`,
        });
        for (const sample of samples) {
          const card = document.createElement('article');
          card.id = sample.id;
          const meta = document.createElement('div');
          meta.className = 'meta';
          const number = document.createElement('span');
          number.className = 'number';
          number.textContent = sample.id.slice(0, 2);
          const family = document.createElement('span');
          family.textContent = `${sample.family} · ${sample.duration.toFixed(2)}秒`;
          meta.append(number, family);
          const title = document.createElement('h2');
          title.textContent = sample.title;
          const feel = document.createElement('div');
          feel.className = 'feel';
          feel.textContent = `「${sample.feel}」`;
          const description = document.createElement('p');
          description.textContent = sample.description;
          const actions = document.createElement('div');
          actions.className = 'actions';
          for (const repeat of [false, true]) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = repeat ? '連続回転' : '単発';
            button.setAttribute(
              'aria-label',
              `${sample.title}を${repeat ? '連続回転' : '単発'}で聴く`,
            );
            button.addEventListener('click', () => start([item(sample, repeat)]));
            actions.append(button);
          }
          const download = document.createElement('a');
          download.className = 'download';
          download.href = `./${sample.file}`;
          download.download = sample.file;
          download.textContent = 'MP3をダウンロード';
          download.setAttribute('aria-label', `${sample.title}のMP3をダウンロード`);
          card.append(meta, title, feel, description, actions, download);
          document.querySelector('#cards').append(card);
        }
        for (const [selector, repeat] of [
          ['#compare', false],
          ['#compare-repeat', true],
        ]) {
          const button = document.querySelector(selector);
          button.disabled = false;
          button.addEventListener('click', () =>
            start(samples.map((sample) => item(sample, repeat))),
          );
        }
        status.textContent = '単発・連続回転のボタンから試聴してください。';
      } catch {
        status.textContent = '一覧を読み込めませんでした。ページを再読み込みしてください。';
      }
    </script>
  </body>
</html>
