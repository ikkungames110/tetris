<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>スマホ対戦レイアウト 5案 | テトクラ</title>
    <link rel="stylesheet" href="preview.css" />
    <script src="preview.js" defer></script>
  </head>
  <body>
    <header class="intro">
      <p class="eyebrow">TETCLA / MOBILE VERSUS STUDY</p>
      <h1>盤面を主役に、対戦を横へ。</h1>
      <p>
        自分の盤面・STOCK・QUEUEの位置を5案で統一。名前と勝利数は左側、相手の盤面は右側のQUEUEの下へ配置します。
      </p>
      <p>
        QUEUEのミノは一人用の70%の幅・高さ。STOCK上部のボタン配置を採用した、操作できない画面モックです。
      </p>
      <div class="tools">
        <label
          >想定画面幅
          <select id="width">
            <option>320</option>
            <option>375</option>
            <option selected>390</option>
            <option>430</option>
          </select>
          px</label
        >
        <label><input type="checkbox" id="guides" /> 配置ガイドを表示</label>
        <a href="../">ゲームへ戻る ↗</a>
      </div>
      <nav aria-label="レイアウト案">
        <a href="#plan-1">01 基本</a><a href="#plan-2">02 中央</a><a href="#plan-3">03 下揃え</a
        ><a href="#plan-4">04 対戦カード</a><a href="#plan-5">05 最小表示</a>
      </nav>
      <p class="note">
        幅が狭い画面ではプレビュー全体を縮小して表示します。対戦盤面を縮める上部スコア欄は設けず、一人用と同じ左右余白で配置する想定です。
      </p>
    </header>
    <main id="gallery"></main>
  </body>
</html>
